name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app and Swift SDK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build app
        run: macos/build.sh
      - name: Build Swift SDK
        run: swift build --package-path sdk/swift
      - name: Frame sheets
        run: macos/.build/release/llm-pet --dump-frames frames
      - name: Package
        run: ditto -c -k --keepParent build/llm-pet.app llm-pet.zip
      - uses: actions/upload-artifact@v7
        with:
          name: llm-pet
          path: llm-pet.zip
      - uses: actions/upload-artifact@v7
        with:
          name: frames
          path: frames

  node:
    name: JS SDK and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test

  release:
    name: Tag and release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip release]')
    needs: [macos, node]
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Next version
        id: version
        run: |
          git fetch --tags --force
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=0.1.0
          elif [ -z "$(git rev-list "$last..HEAD")" ]; then
            echo "No commits since $last"
            exit 0
          else
            log=$(git log --format='%s%n%b' "$last..HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            if grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE' <<< "$log"; then
              next="$((major + 1)).0.0"
            elif grep -qE '^feat(\(.+\))?:' <<< "$log"; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next"
      - name: Tag
        if: steps.version.outputs.next
        run: |
          git tag "v${{ steps.version.outputs.next }}"
          git push origin "v${{ steps.version.outputs.next }}"
      - uses: actions/download-artifact@v8
        if: steps.version.outputs.next
        with:
          name: llm-pet
      - name: GitHub release
        if: steps.version.outputs.next
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.next }}" llm-pet.zip --title "v${{ steps.version.outputs.next }}" --generate-notes

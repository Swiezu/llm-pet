name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  macos:
    name: macOS app and Swift SDK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build app
        run: macos/build.sh
      - name: Build Swift SDK
        run: swift build --package-path sdk/swift
      - name: Frame sheets
        run: macos/.build/release/llm-pet --dump-frames frames
      - name: Package
        run: ditto -c -k --keepParent build/llm-pet.app llm-pet.zip
      - uses: actions/upload-artifact@v4
        with:
          name: llm-pet
          path: llm-pet.zip
      - uses: actions/upload-artifact@v4
        with:
          name: frames
          path: frames
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" llm-pet.zip --title "$GITHUB_REF_NAME" --generate-notes

  node:
    name: JS SDK and MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test

  npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, node]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Latest npm for trusted publishing
        run: npm install -g npm@latest
      - name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --workspaces
          npm pkg set "dependencies.@swiezu/llm-pet-sdk=^$version" --workspace mcp
          npm install --package-lock-only
      - name: Install
        run: npm ci
      - name: Publish SDK
        run: npm publish --workspace sdk/js --provenance --access public
      - name: Publish MCP
        run: npm publish --workspace mcp --provenance --access public
